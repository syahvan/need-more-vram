name: Update cloud GPU pricing

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate src/data/pricing.json
        shell: bash # explicit bash => pipefail, so a script failure fails the step
        env:
          # Optional. Enables per-region GCP GPU (T4/V100) prices via the Cloud Billing Catalog API.
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
        run: node scripts/update-pricing.mjs 2>&1 | tee "$RUNNER_TEMP/pricing.log"

      - name: Validate data files
        run: node scripts/update-pricing.mjs --check

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/data/pricing.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "Automated weekly refresh of \`src/data/pricing.json\` by \`scripts/update-pricing.mjs\`."
              echo
              echo '```'
              grep -E '^(WARN|  (aws|gcp) |[0-9]+ offers)' "$RUNNER_TEMP/pricing.log" || true
              echo '```'
              echo
              echo "Lines starting with WARN mean a source failed and its previous values were kept."
            } > "$RUNNER_TEMP/pr-body.md"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-pricing
          delete-branch: true
          add-paths: src/data/pricing.json
          commit-message: "chore: update cloud GPU pricing"
          title: "chore: update cloud GPU pricing"
          body-path: ${{ runner.temp }}/pr-body.md
